server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # El documento HTML debe comprobarse en cada navegacion. Los nombres de los
  # assets de Vite ya contienen un hash y son los unicos que se cachean fuerte.
  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Versiones antiguas de desarrollo/PWA dejaron estas importaciones en la
  # cache de algunos Safari. Entregar JS de recuperacion evita responderles
  # index.html (text/html) y permite limpiar el registro obsoleto.
  location ~ ^/(?:@vite/client|@react-refresh|@vite-plugin-pwa/pwa-entry-point-loaded|src/main\.tsx)$ {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /stale-client-recovery.js =404;
  }

  location = /dev-sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
